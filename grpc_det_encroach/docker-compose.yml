# Chạy đơn lẻ service này: docker compose up -d --build
services:
  detector:
    build: .
    image: harbor.tado.vn/long_dev/grpc-det-encroach:v1.0.0
    container_name: grpc_det_encroach
    volumes:
      - ./models/encroach_trt:/app/models/yolo/trt
    ports:
      - "50060:50060"
    environment:
      GRPC_PORT: 50060
      USE_TENSORRT: ${USE_TENSORRT:-true}
      CONF_THRESHOLD: ${CONF_THRESHOLD:-0.1}
      BATCH_SIZE: ${BATCH_SIZE:-8}
      BATCH_TIMEOUT_MS: ${BATCH_TIMEOUT_MS:-10}
      CLASS_NAMES: ${CLASS_NAMES:-}
      # CMS — Lấy SESSION_KEY từ .env (nếu không có sẽ dùng mặc định từ Dockerfile)
      BASE_URL_API: ${BASE_URL_API:-https://api-dev.tado.vn}
      SESSION_KEY: ${SESSION_KEY:-}
      # Cổng license: chỉ mở cho camera khởi tạo với service_type này + license_key
      SERVICE_TYPE: ${SERVICE_TYPE:-sidewalk_occupation}
      POLL_INTERVAL: ${POLL_INTERVAL:-20}
      # Lấn chiếm quá 10 giây trong ROI thì báo
      DWELL_SECONDS: ${DWELL_SECONDS:-60}
      ALARM_COOLDOWN: ${ALARM_COOLDOWN:-60}
      ALARM_TYPE: ${ALARM_TYPE:-encroach}
      ALARM_SOURCE: ${ALARM_SOURCE:-grpc_det_encroach}
      JPEG_QUALITY: ${JPEG_QUALITY:-60}
    gpus: all
    restart: always
    networks:
      - grpc-net

networks:
  grpc-net:
    driver: bridge
